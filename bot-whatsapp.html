<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Novillos — Bot de WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   LOS NOVILLOS — SISTEMA DE DISEÑO
   Tokens y componentes reales de la app (nada de esto es
   decoración de prototipo: cada clase de aquí se usa en las
   pantallas de app-cliente.html, app-chofer.html, app-equipo.html
   y en la interfaz de chat de bot-whatsapp.html)
   =========================================================== */

:root{
  /* Paleta */
  --navy:#0F2542;
  --navy-2:#17335C;
  --navy-3:#22456F;
  --ink:#16233A;
  --gray-900:#1F2937;
  --gray-700:#3E4859;
  --gray-600:#5B6472;
  --gray-500:#7A8494;
  --gray-400:#9AA4B2;
  --gray-300:#C4CBD4;
  --gray-200:#E1E6ED;
  --gray-100:#EEF1F5;
  --gray-50:#F7F8FA;
  --white:#FFFFFF;
  --green:#1E9E63;
  --green-bg:#E7F6EE;
  --orange:#E38C1D;
  --orange-bg:#FDF1E0;
  --red:#D6455A;
  --red-bg:#FBE9EC;
  --gold:#B98A3E;
  --gold-bg:#F6EFE1;

  /* WhatsApp */
  --wa:#25D366;
  --wa-dark:#075E54;
  --wa-in:#FFFFFF;
  --wa-out:#DCF8C6;

  /* Sombras y radios */
  --shadow-sm:0 1px 2px rgba(15,37,66,.08);
  --shadow-md:0 6px 20px rgba(15,37,66,.10);
  --radius:14px;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--gray-50);
  color:var(--ink);
  font-family:'Inter', sans-serif;
}

/* Tipografías: Manrope (títulos/marca), Inter (texto), JetBrains Mono (números/datos) */

/* ---------- estructura base de pantalla ---------- */
.app-screen{
  display:flex;
  flex-direction:column;
  height:100%;
  background:var(--gray-50);
}
.statusbar{
  height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:'Inter';font-size:11px;font-weight:600;background:#fff;
}
.appbar{
  padding:12px 18px 10px;background:#fff;border-bottom:1px solid var(--gray-200);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.appbar-back{cursor:pointer;font-size:15px;color:var(--navy);}
.appbar-title{font-family:'Manrope';font-weight:700;font-size:15px;color:var(--navy);}
.appbar-sub{font-family:'Inter';font-size:10.5px;color:var(--gray-500);}
.app-body{flex:1;overflow-y:auto;padding:14px;}
.tabbar{
  height:54px;flex-shrink:0;background:#fff;border-top:1px solid var(--gray-200);
  display:flex;align-items:center;justify-content:space-around;
}
.tabitem{
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Inter';font-size:9.5px;
  font-weight:700;color:var(--gray-400);cursor:pointer;background:none;border:none;
}
.tabitem.active{color:var(--navy);}
.tabitem .ic{width:18px;height:18px;border-radius:5px;background:var(--gray-200);}
.tabitem.active .ic{background:var(--navy);}

/* ---------- componentes generales ---------- */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono';font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;letter-spacing:.02em;}
.tag.green{background:var(--green-bg);color:var(--green);}
.tag.orange{background:var(--orange-bg);color:var(--orange);}
.tag.red{background:var(--red-bg);color:var(--red);}
.tag.gray{background:var(--gray-100);color:var(--gray-600);}
.tag.navy{background:#E7ECF4;color:var(--navy);}
.tag.gold{background:var(--gold-bg);color:var(--gold);}

.btn{font-family:'Manrope';font-weight:700;font-size:13px;border-radius:9px;padding:11px 18px;border:none;cursor:pointer;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-sm{padding:7px 12px;font-size:11.5px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

input,select,textarea{
  font-family:'Inter';font-size:13px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:8px;
  width:100%;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-3);}
label.field-label{font-family:'Inter';font-size:11.5px;font-weight:600;color:var(--gray-600);display:block;margin-bottom:5px;}

/* ---------- inicio de sesión / registro ---------- */
.auth-screen{flex:1;display:flex;flex-direction:column;padding:26px 20px;overflow-y:auto;background:#fff;}
.auth-logo{height:30px;margin:0 auto 6px;display:block;}
.auth-sub{text-align:center;font-family:'Inter';font-size:10.5px;color:var(--gray-500);margin-bottom:20px;}
.auth-input{margin-bottom:10px;}
.auth-link{text-align:center;font-family:'Inter';font-size:11px;color:var(--navy-3);margin-top:14px;cursor:pointer;text-decoration:underline;}
.auth-divider{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--gray-400);font-family:'Inter';font-size:10px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--gray-200);}

/* ---------- firma digital (canvas real) ---------- */
.sig-canvas-wrap{border:1.5px dashed var(--gray-300);border-radius:8px;position:relative;background:#fff;}
.sig-canvas-wrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair;}
.sig-clear{position:absolute;top:4px;right:6px;font-family:'Inter';font-size:9px;color:var(--gray-400);background:none;border:none;cursor:pointer;text-decoration:underline;}

/* ---------- chat de WhatsApp ---------- */
.wa-frame{background:#E7DDD3;height:100%;display:flex;flex-direction:column;}
.wa-top{background:var(--wa-dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.wa-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:700;color:#fff;font-size:12px;}
.wa-name{font-family:'Inter';font-weight:700;font-size:13px;}
.wa-status{font-family:'Inter';font-size:10px;color:#CFE9E4;}
.wa-msgs{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
.bubble{max-width:82%;padding:8px 11px;border-radius:10px;font-family:'Inter';font-size:12px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.06);color:#111;}
.bubble.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px;}
.bubble.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px;}
.bubble .time{display:block;text-align:right;font-size:9px;color:#8b9a8f;margin-top:2px;}
.wa-options{display:flex;flex-direction:column;gap:6px;padding:8px 10px 12px;background:#E7DDD3;flex-shrink:0;}
.wa-opt-btn{background:#fff;border:1.5px solid var(--wa);color:var(--wa-dark);font-family:'Inter';font-weight:700;font-size:11.5px;border-radius:8px;padding:9px;cursor:pointer;}
.wa-opt-btn:hover{background:var(--wa);color:#fff;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px;}

/* alias usado por la lógica de la app (mismo componente que .app-body) */
.phone-body{flex:1;overflow-y:auto;padding:14px;}

html,body{height:100%;}
#app-root{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#F7F8FA;box-shadow:0 0 40px rgba(0,0,0,.08);}

  html,body{height:100%;}
  body{background:#0b141a;}
  #app-root{height:100vh;max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.35);}
  .wa-top{justify-content:space-between;}
  .wa-reset-btn{background:none;border:none;color:#fff;opacity:.75;font-size:16px;cursor:pointer;padding:4px;}
  .wa-reset-btn:hover{opacity:1;}
</style>
</head>
<body>
<div id="app-root">
  <div class="wa-frame">
    <div class="wa-top">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="wa-avatar">LN</div>
        <div><div class="wa-name">Los Novillos</div><div class="wa-status">en línea</div></div>
      </div>
      <button class="wa-reset-btn" id="wa-reset" title="Reiniciar conversación">↺</button>
    </div>
    <div class="wa-msgs" id="wa-msgs"></div>
    <div class="wa-options" id="wa-options"></div>
  </div>
</div>

<script>
const CONST = {
  TARIFA_KM_JAULA_SIMPLE: 4100, TARIFA_KM_BITREN: 6000, PORCENTAJE_KM_PLUS: 0.05,
  MIN_KM_PLUS_CANJE: 500, MIN_KM_PLUS_POR_OPERACION: 100, MAX_PORC_VIAJE_CON_KM_PLUS: 0.30,
  TASA_INTERES_ANUAL: 0.15, DIAS_ASIGNACION_CHOFER: 1, DIAS_ALERTA_VENCIMIENTO: 15,
};
function money(n){ return '$' + Math.round(n).toLocaleString('es-AR'); }
</script>
<script>
(function(){
  const msgsEl = document.getElementById('wa-msgs');
  const optsEl = document.getElementById('wa-options');
  let pedido = {};


  function nowTime(){ return new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
  function scrollChat(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
  function addBubble(html, dir){
    const b = document.createElement('div');
    b.className = 'bubble ' + dir;
    b.innerHTML = html + '<span class="time">'+nowTime()+'</span>';
    msgsEl.appendChild(b);
    scrollChat();
  }
  function addCustomBubble(html){
    const b = document.createElement('div');
    b.className = 'bubble in';
    b.style.maxWidth = '92%';
    b.style.background = '#fff';
    b.innerHTML = html;
    msgsEl.appendChild(b);
    scrollChat();
  }
  function setOptions(list){
    optsEl.innerHTML = '';
    list.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'wa-opt-btn';
      btn.textContent = opt.label;
      btn.onclick = opt.action;
      optsEl.appendChild(btn);
    });
  }
  function explain(text){ /* sin panel lateral en esta versión */ }
  function volverMenu(){
    return {label:'↺ Volver al menú principal', action: ()=>resetChat()};
  }

  function resetChat(){
    pedido = {};
    msgsEl.innerHTML = '';
    optsEl.innerHTML = '';
    explain('Un único menú, disparado con un simple "Hola", deriva a viaje, administración/facturación, RR.HH. o un asesor humano.');
    addBubble('Hola', 'in');
    addBubble('👋 ¡Hola! Gracias por comunicarte con Los Novillos.<br>¿Cómo podemos ayudarte?<br><br>1️⃣ 🚛 Solicitar un viaje<br>2️⃣ 📄 Administración / Facturación<br>3️⃣ 👷 Trabajar con nosotros<br>4️⃣ 🙋 Hablar con un asesor<br><br>Respondé con el número de la opción.', 'out');
    setOptions([
      {label:'1️⃣ 🚛 Solicitar un viaje', action: menuViaje},
      {label:'2️⃣ 📄 Administración / Facturación', action: menuAdministracion},
      {label:'3️⃣ 👷 Trabajar con nosotros', action: menuRRHH},
      {label:'4️⃣ 🙋 Hablar con un asesor', action: menuAsesor},
    ]);
  }

  // ============ 1️⃣ SOLICITAR UN VIAJE — /viaje ============
  function menuViaje(){
    addBubble('1', 'in');
    addBubble('🚛 <b>Solicitar un viaje</b><br>¡Perfecto! Para poder ayudarte, envianos:<br>• Origen<br>• Destino<br>• Tipo de carga<br>• Cantidad de cabezas / toneladas<br>• Fecha estimada<br>• Ubicación de origen y destino como figura en Google Maps.<br><br>Con esa información nuestro equipo podrá avanzar con tu solicitud.', 'out');
    explain('Plantilla del pedido: origen, destino, tipo de carga, cantidad, fecha y ubicación de Google Maps. Con esos datos se cotiza automáticamente.');
    const formHtml = `
      <div style="display:flex;flex-direction:column;gap:6px;">
        <input id="f-origen" placeholder="Origen (ej: Azul)" style="font-size:11px;padding:6px 8px;">
        <input id="f-destino" placeholder="Destino (ej: Cañuelas)" style="font-size:11px;padding:6px 8px;">
        <select id="f-tipo" style="font-size:11px;padding:6px 8px;">
          <option value="hacienda">🐄 Hacienda</option>
          <option value="granos">🌾 Granos</option>
        </select>
        <input id="f-cabezas" type="number" placeholder="Cantidad (cabezas o toneladas)" value="62" style="font-size:11px;padding:6px 8px;">
        <input id="f-km" type="number" placeholder="Km estimados (Google Maps)" value="340" style="font-size:11px;padding:6px 8px;">
        <input id="f-fecha" type="date" style="font-size:11px;padding:6px 8px;">
        <button class="wa-opt-btn" style="margin-top:4px;" onclick="window.__lnEnviarPedido()">Enviar pedido</button>
      </div>`;
    addCustomBubble(formHtml);
    optsEl.innerHTML = '';
    window.__lnEnviarPedido = function(){
      const origen = document.getElementById('f-origen').value || 'Azul';
      const destino = document.getElementById('f-destino').value || 'Cañuelas';
      const tipo = document.getElementById('f-tipo').value;
      const cabezas = document.getElementById('f-cabezas').value || '62';
      const km = parseFloat(document.getElementById('f-km').value) || 340;
      pedido = {origen, destino, tipo, cabezas, km};
      addBubble(`${origen} → ${destino} · ${cabezas} ${tipo==='granos'?'toneladas':'cabezas'} · ~${km} km estimados<br>📍 Ubicación compartida por Google Maps`, 'in');
      cotizarViaje();
    };
  }

  function cotizarViaje(){
    const tarifa = pedido.tipo === 'granos' ? CONST.TARIFA_KM_BITREN : CONST.TARIFA_KM_JAULA_SIMPLE;
    const monto = tarifa * pedido.km;
    pedido.tarifa = tarifa; pedido.monto = monto;
    addBubble(`Tarifa: <b>${money(tarifa)}/km × ~${pedido.km} km estimados ≈ ${money(monto)}</b><br><span style="font-size:10px;color:#556;">+ peajes, seguro y lavado · sujeto a ajuste por km real · podés pagar parte con Km LN Plus</span>`, 'out');
    explain('El cliente ve la tarifa por km y el estimado — nunca un número escondido. Puede aceptar, proponer otro precio, o pedir un asesor. Esto es igual para clientes chicos, medianos o grandes.');
    setOptions([
      {label:'✅ Acepto', action: viajeAcepta},
      {label:'✏️ Proponer otro precio', action: viajePropone},
      {label:'🙋 Contactar a un asesor', action: menuAsesor},
    ]);
  }
  function viajeAcepta(){
    addBubble('Acepto', 'in');
    addBubble('Gracias 🙌 Tu pedido queda <b>pendiente de confirmación</b> — Nuestro equipo valida que haya camión disponible para esa fecha, y te avisamos por aquí.', 'out');
    explain('Importante: aceptar la tarifa no es lo mismo que estar confirmado. Recién cuando Nuestro equipo valida disponibilidad, el pedido pasa a "Confirmado".');
    setOptions([volverMenu()]);
  }
  function viajePropone(){
    addBubble('✏️ Proponer otro precio', 'in');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-propuesta" type="number" placeholder="Tu propuesta $" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnEnviarPropuesta()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnEnviarPropuesta = function(){
      const val = document.getElementById('f-propuesta').value || Math.round(pedido.monto*0.9);
      addBubble(money(val), 'in');
      addBubble('Recibido ✅ Queda sujeto a aprobación de un asesor — te contestamos a la brevedad por este mismo chat.', 'out');
      explain('La opción de proponer precio está disponible para cualquier cliente, chico o grande — no es exclusiva de cuentas grandes.');
      setOptions([volverMenu()]);
    };
  }

  // ============ 2️⃣ ADMINISTRACIÓN / FACTURACIÓN — /administracion ============
  function menuAdministracion(){
    addBubble('2', 'in');
    addBubble('📄 <b>Administración / Facturación</b><br>¿Qué necesitás hacer?<br><br>1️⃣ Enviar una factura<br>2️⃣ Consultar fecha de pago<br>3️⃣ Consultar deuda / saldo<br>4️⃣ Consultar una cobranza<br>5️⃣ Otra consulta administrativa<br><br>Respondé con el número de la opción.', 'out');
    explain('Menú de administración. Cada opción tiene además un comando rápido independiente (/factura, /pago, /deuda, /cobranza) para quien ya sabe qué necesita.');
    setOptions([
      {label:'1️⃣ Enviar una factura', action: subFactura},
      {label:'2️⃣ Consultar fecha de pago', action: subPago},
      {label:'3️⃣ Consultar deuda / saldo', action: subDeuda},
      {label:'4️⃣ Consultar una cobranza', action: subCobranza},
      {label:'5️⃣ Otra consulta administrativa', action: subOtraAdmin},
    ]);
    mostrarAccesosDirectos();
  }
  function mostrarAccesosDirectos(){
    addCustomBubble(`
      <div style="font-size:9.5px;color:var(--gray-500);margin-bottom:5px;">Accesos directos:</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmd('factura')">/factura</span>
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmd('pago')">/pago</span>
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmd('deuda')">/deuda</span>
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmd('cobranza')">/cobranza</span>
      </div>`);
    window.__lnCmd = function(cmd){
      if(cmd==='factura') subFactura();
      else if(cmd==='pago') subPago();
      else if(cmd==='deuda') subDeuda();
      else if(cmd==='cobranza') subCobranza();
    };
  }
  function subFactura(){
    addBubble('/factura', 'in');
    addBubble('📎 <b>Enviar una factura</b><br>Por favor, envianos la factura en PDF junto con tu CUIT.<br>Nuestro equipo de Administración la revisará y confirmará su recepción.', 'out');
    addCustomBubble(`<div style="border:1.5px dashed var(--gray-300);border-radius:6px;padding:8px;text-align:center;font-size:10px;color:var(--gray-500);cursor:pointer;" onclick="window.__lnAdjuntarFactura()">📎 Adjuntar PDF + CUIT</div>`);
    optsEl.innerHTML = '';
    window.__lnAdjuntarFactura = function(){
      addBubble('📎 factura_0041.pdf · CUIT 30-65498712-3', 'in');
      addBubble('Recibido ✅ Te confirmamos la recepción por este chat.', 'out');
      setOptions([volverMenu()]);
    };
  }
  function subPago(){
    addBubble('/pago', 'in');
    addBubble('📅 <b>Consultar fecha de pago</b><br>Contanos tu CUIT o número de factura y te confirmamos la fecha de pago programada.', 'out');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-cuit-pago" placeholder="CUIT o N° de factura" value="30-65498712-3" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnConsultarPago()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnConsultarPago = function(){
      const v = document.getElementById('f-cuit-pago').value || '30-65498712-3';
      addBubble(v, 'in');
      addBubble('Tu factura A-3312 tiene fecha de pago programada para el <b>12/08</b>.', 'out');
      setOptions([volverMenu()]);
    };
  }
  function subDeuda(){
    addBubble('/deuda', 'in');
    addBubble('💰 <b>Consultar deuda / saldo</b><br>Pasanos tu CUIT para revisar tu cuenta.', 'out');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-cuit-deuda" placeholder="CUIT" value="30-65498712-3" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnConsultarDeuda()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnConsultarDeuda = function(){
      const cuit = document.getElementById('f-cuit-deuda').value || '30-65498712-3';
      addBubble(cuit, 'in');
      addBubble('Tenés <b>$340.200</b> pendientes · 2 facturas (venc. 12/08 y 20/08).', 'out');
      explain('"Deuda" se responde solo: el bot busca el CUIT en el sistema y contesta el saldo, sin que nadie del equipo lo escriba a mano.');
      setOptions([volverMenu()]);
    };
  }
  function subCobranza(){
    addBubble('/cobranza', 'in');
    addBubble('🧾 <b>Consultar una cobranza</b><br>Contanos el número de comprobante o el monto para ubicar la cobranza y confirmarte el estado.', 'out');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-cobranza" placeholder="N° de comprobante o monto" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnConsultarCobranza()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnConsultarCobranza = function(){
      const v = document.getElementById('f-cobranza').value || '$122.300';
      addBubble(v, 'in');
      addBubble('Encontramos tu cobranza: <b>acreditada el 05/08</b>. Cualquier otra duda, quedamos atentos.', 'out');
      setOptions([volverMenu()]);
    };
  }
  function subOtraAdmin(){
    addBubble('5', 'in');
    addBubble('✍️ Contanos brevemente tu consulta y la derivamos al equipo de Administración.', 'out');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-otra-admin" placeholder="Escribí tu consulta" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnOtraAdmin()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnOtraAdmin = function(){
      addBubble(document.getElementById('f-otra-admin').value || 'Consulta administrativa', 'in');
      addBubble('Gracias, la recibimos. Alguien del equipo de Administración te va a responder por este chat.', 'out');
      setOptions([volverMenu()]);
    };
  }

  // ============ 3️⃣ TRABAJAR CON NOSOTROS — /rrhh ============
  function menuRRHH(){
    addBubble('3', 'in');
    addBubble('👷 <b>Trabajá con Los Novillos</b><br>¡Gracias por tu interés en formar parte de nuestro equipo!<br>¿Qué estás buscando?<br><br>1️⃣ Quiero trabajar como chofer<br>2️⃣ Quiero postularme a otra área<br>3️⃣ Quiero enviar mi CV<br><br>Respondé con el número de la opción.', 'out');
    explain('El menú de RR.HH. deriva todo a la carga del CV — con comandos rápidos CV, curriculum o trabajar para llegar directo.');
    setOptions([
      {label:'1️⃣ Quiero trabajar como chofer', action: ()=>subRRHH('chofer')},
      {label:'2️⃣ Quiero postularme a otra área', action: ()=>subRRHH('area')},
      {label:'3️⃣ Quiero enviar mi CV', action: subCV},
    ]);
    addCustomBubble(`
      <div style="font-size:9.5px;color:var(--gray-500);margin-bottom:5px;">Accesos directos:</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmdRRHH()">CV</span>
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmdRRHH()">curriculum</span>
        <span class="tag navy" style="font-size:8.5px;cursor:pointer;" onclick="window.__lnCmdRRHH()">trabajar</span>
      </div>`);
    window.__lnCmdRRHH = function(){ subCV(); };
  }
  function subRRHH(tipo){
    addBubble(tipo==='chofer' ? '1' : '2', 'in');
    if(tipo==='chofer'){
      addBubble('🚚 ¡Genial! Necesitamos que nos envíes tu CV para sumarte a la base de choferes.', 'out');
    } else {
      addBubble('¡Buenísimo! Contanos a qué área te gustaría postularte y envianos tu CV.', 'out');
    }
    subCV();
  }
  function subCV(){
    addBubble('/cv', 'in');
    addBubble('📄 Enviános tu CV en PDF junto con:<br>• Nombre y apellido<br>• Localidad<br>• Puesto al que querés postularte<br>• Teléfono de contacto<br><br>Nuestro equipo de RR.HH. lo recibirá para futuras búsquedas.', 'out');
    addCustomBubble(`<div style="border:1.5px dashed var(--gray-300);border-radius:6px;padding:8px;text-align:center;font-size:10px;color:var(--gray-500);cursor:pointer;" onclick="window.__lnAdjuntarCV()">📎 Adjuntar CV en PDF</div>`);
    optsEl.innerHTML = '';
    window.__lnAdjuntarCV = function(){
      addBubble('📎 CV_candidato.pdf', 'in');
      addBubble('¡Gracias! Quedaste en nuestra base para futuras búsquedas. 🙌', 'out');
      setOptions([volverMenu()]);
    };
  }

  // ============ 4️⃣ HABLAR CON UN ASESOR — /asesor ============
  function menuAsesor(){
    addBubble('4', 'in');
    addBubble('🙋 <b>Hablar con un asesor</b><br>¡Claro! Contanos brevemente el motivo de tu consulta.<br>Un integrante del equipo de Los Novillos continuará la conversación apenas esté disponible.', 'out');
    explain('El asesor humano toma la conversación desde este punto — el bot no intenta resolver esto solo.');
    addCustomBubble(`<div style="display:flex;gap:6px;"><input id="f-asesor" placeholder="Contanos el motivo" style="font-size:11px;padding:6px 8px;"><button class="wa-opt-btn" style="white-space:nowrap;" onclick="window.__lnEnviarAsesor()">Enviar</button></div>`);
    optsEl.innerHTML = '';
    window.__lnEnviarAsesor = function(){
      addBubble(document.getElementById('f-asesor').value || 'Quiero hablar con un asesor', 'in');
      addBubble('Gracias 🙌 Ya avisamos al equipo, en breve continúan la conversación por este mismo chat.', 'out');
      setOptions([volverMenu()]);
    };
  }

  document.getElementById('wa-reset').onclick = ()=>resetChat();
  resetChat();
})();
</script>
</body>
</html>
